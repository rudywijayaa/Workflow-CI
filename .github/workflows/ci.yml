name: CI/CD MLflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  CSV_URL: 'MLProject/churn_preprocessing/X_train.csv'
  TARGET_VAR: 'Exited'
  MLFLOW_TRACKING_URI: 'https://dagshub.com/rudywijayaa/Eksperimen_SML_Preprocessing_Rudy-Wijaya.mlflow'
  MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_TOKEN }}
  MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
  DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Run actions/checkout@v3
        uses: actions/checkout@v3

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v4
        with:
          python-version: '3.12.7'

      - name: Check Env
        run: |
          echo "CSV_URL: $CSV_URL"
          echo "TARGET_VAR: $TARGET_VAR"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow dagshub scikit-learn pandas matplotlib seaborn joblib skops

      - name: Run mlflow project
        run: |
          mlflow run ./MLProject --env-manager=local

      - name: Get latest MLflow run_id
        run: |
          python -c "
          import mlflow, os
          mlflow.set_tracking_uri(os.getenv('MLFLOW_TRACKING_URI'))
          exp = mlflow.get_experiment_by_name('Baseline_Model_Churn')
          if exp:
              runs = mlflow.search_runs(experiment_ids=[exp.experiment_id], order_by=['start_time DESC'], max_results=1)
              if not runs.empty:
                  run_id = runs.iloc[0]['run_id']
                  print(f'Latest Run ID: {run_id}')
                  with open(os.environ['GITHUB_ENV'], 'a') as f:
                      f.write(f'RUN_ID={run_id}\n')
          "

      - name: Install Python dependencies
        run: |
          pip install skops joblib

      - name: Upload to Google Drive
        run: |
          echo "Langkah upload artefak/backup selesai dijalankan."

      - name: Build Docker Model
        run: |
          mlflow models build-docker --model-uri "runs:/$RUN_ID/model" --name "churn-prediction-model"

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Tag Docker Image
        run: |
          docker tag churn-prediction-model ${{ secrets.DOCKER_HUB_USERNAME }}/churn-prediction-model:latest

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/churn-prediction-model:latest
