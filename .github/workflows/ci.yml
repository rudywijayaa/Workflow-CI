name: Model Training CI Pipeline

on:
  push:
    branches: ['main']
  workflow_dispatch:

jobs:
  run-ci-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12.7'

      - name: Check Env
        run: |
          python --version
          pip --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow dagshub pandas scikit-learn docker

      - name: Run mlflow project
        env:
          MLFLOW_TRACKING_URI: https://dagshub.com/rudywijayaa/Eksperimen_SML_Rudy-Wijaya.mlflow
          MLFLOW_TRACKING_USERNAME: rudywijayaa
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          mlflow run ./MLProject --env-manager=local

      - name: Get latest MLflow run_id
        env:
          MLFLOW_TRACKING_URI: https://dagshub.com/rudywijayaa/Eksperimen_SML_Rudy-Wijaya.mlflow
          MLFLOW_TRACKING_USERNAME: rudywijayaa
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          python -c "
          import mlflow, os
          mlflow.set_tracking_uri('https://dagshub.com/rudywijayaa/Eksperimen_SML_Rudy-Wijaya.mlflow')
          runs = mlflow.search_runs(search_all_experiments=True, order_by=['start_time DESC'], max_results=1)
          if not runs.empty:
              run_id = runs.iloc[0]['run_id']
              print(f'Terdeteksi RUN_ID terbaru: {run_id}')
              with open(os.environ['GITHUB_ENV'], 'a') as f:
                  f.write(f'RUN_ID={run_id}\n')
          else:
              raise Exception('Tidak ada run yang ditemukan pada repo Eksperimen_SML_Rudy-Wijaya')
          "

      - name: Build Docker Model
        env:
          MLFLOW_TRACKING_URI: https://dagshub.com/rudywijayaa/Eksperimen_SML_Rudy-Wijaya.mlflow
          MLFLOW_TRACKING_USERNAME: rudywijayaa
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
          DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          python -c "
          import os, dagshub, mlflow
          dagshub.init(repo_owner='rudywijayaa', repo_name='Eksperimen_SML_Rudy-Wijaya', mlflow=True)
          run_id = os.environ['RUN_ID']
          print(f'Mengunduh artifact untuk RUN_ID: {run_id}')
          mlflow.artifacts.download_artifacts(run_id=run_id, artifact_path='model', dst_path='./downloaded_model')
          "
          mlflow models build-docker --model-uri "./downloaded_model" --name "wijayarudy/churn-prediction-model:latest"

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Push Docker Image
        run: |
          docker push wijayarudy/churn-prediction-model:latest
