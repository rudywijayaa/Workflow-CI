name: CI Retraining Churn Model (Advance)

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v4
        with:
          python-version: '3.12.7'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scikit-learn mlflow dagshub

      - name: Run Model Retraining via MLflow Project
        env:
          DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
          MLFLOW_TRACKING_URI: https://dagshub.com/rudywijayaa/Eksperimen_SML_Preprocessing_Rudy-Wijaya.mlflow
          MLFLOW_TRACKING_USERNAME: rudywijayaa
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          cd MLProject
          mlflow run . --entry-point main --env-manager local

      - name: Download Model Artifact from DagsHub
        if: github.event_name != 'pull_request'
        env:
          DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
          MLFLOW_TRACKING_URI: https://dagshub.com/rudywijayaa/Eksperimen_SML_Preprocessing_Rudy-Wijaya.mlflow
          MLFLOW_TRACKING_USERNAME: rudywijayaa
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          python -c "import os, dagshub, mlflow; dagshub.init(repo_owner='rudywijayaa', repo_name='Eksperimen_SML_Preprocessing_Rudy-Wijaya', mlflow=True); mlflow.set_tracking_uri(os.getenv('MLFLOW_TRACKING_URI')); run_id = os.getenv('RUN_ID'); print(f'Downloading RUN_ID: {run_id}'); mlflow.artifacts.download_artifacts(artifact_uri=f'runs:/{run_id}/model', dst_path='./downloaded_model')"

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build & Push Docker Image
        if: github.event_name != 'pull_request'
        run: |
          mlflow models build-docker --model-uri "./downloaded_model" --name "${{ secrets.DOCKER_HUB_USERNAME }}/churn-prediction-model:latest"
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/churn-prediction-model:latest
