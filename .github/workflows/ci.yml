name: Model Training CI Pipeline

on:
  push:
    branches: ['main', 'master']
  workflow_dispatch:

jobs:
  run-ci-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v4
        with:
          python-version: '3.12.7'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow dagshub pandas numpy scikit-learn matplotlib seaborn

      - name: Run mlflow project
        env:
          MLFLOW_TRACKING_URI: https://dagshub.com/rudywijayaa/Eksperimen_SML_Preprocessing_Rudy-Wijaya.mlflow
          MLFLOW_TRACKING_USERNAME: rudywijayaa
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
          DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          mlflow run MLProject --env-manager=local

      - name: Get latest MLflow run_id
        env:
          MLFLOW_TRACKING_URI: https://dagshub.com/rudywijayaa/Eksperimen_SML_Preprocessing_Rudy-Wijaya.mlflow
          MLFLOW_TRACKING_USERNAME: rudywijayaa
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          # Mengambil RUN_ID terbaru langsung dari server DagsHub menggunakan Python MLflow API
          RUN_ID=$(python -c "import mlflow; df = mlflow.search_runs(experiment_ids=['0'], order_by=['start_time DESC']); print(df['run_id'].iloc[0])")
          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV
          echo "Latest run_id: $RUN_ID"

      - name: Build Docker Model
        env:
          MLFLOW_TRACKING_URI: https://dagshub.com/rudywijayaa/Eksperimen_SML_Preprocessing_Rudy-Wijaya.mlflow
          MLFLOW_TRACKING_USERNAME: rudywijayaa
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
          DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          # 1. Unduh artifact model dari DagsHub ke folder lokal 'downloaded_model'
          python -c "
          import os, dagshub, mlflow
          dagshub.init(repo_owner='rudywijayaa', repo_name='Eksperimen_SML_Preprocessing_Rudy-Wijaya', mlflow=True)
          run_id = os.environ['RUN_ID']
          mlflow.artifacts.download_artifacts(run_id=run_id, artifact_path='model', dst_path='./downloaded_model')
          "

          # 2. Build Docker image langsung dari folder lokal
          mlflow models build-docker --model-uri "./downloaded_model" --name "churn-model"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Tag Docker Image
        run: |
          docker tag churn-model ${{ secrets.DOCKER_HUB_USERNAME }}/churn-model:latest

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/churn-model:latest
